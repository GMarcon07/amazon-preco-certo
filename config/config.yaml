amazon:
  base_url: "https://www.amazon.es"
  locale: "es-ES"
  timezone: "Europe/Madrid"
  headless: true
  page_timeout_ms: 30000
  delay_between_requests_min: 3.0
  delay_between_requests_max: 6.5
  max_pages_per_category: 3

detection:
  # Desconto riscado oficial (PVP) mínimo exigido (ex: 0.60 = 60%)
  min_strikethrough_discount: 0.60
  # Queda real face à média histórica individual do produto (ex: 0.40 = 40% abaixo)
  min_historical_discount: 0.40
  # Queda face à mediana de produtos semelhantes da mesma categoria
  min_category_discount: 0.50
  # Poupança mínima absoluta em euros (evita 'falsos' descontos em coisas baratas)
  min_saving_euros: 50.0
  # Mínimo de reviews para o produto ser confiável (elimina scams de lojas recém-criadas)
  min_review_count: 25
  # Avaliação mínima em estrelas
  min_rating: 3.8
  # Intervalo de cooldown em horas para não repetir alertas do mesmo ASIN
  alert_cooldown_hours: 24

scheduler:
  # Intervalo entre rondas completas de scan em minutos
  interval_minutes: 30
  # Jitter aleatório em segundos adicionado/subtraído ao intervalo
  jitter_seconds: 120

# Palavras-chave globais que identificam acessórios ou itens falsos a ignorar
blacklist_keywords:
  - "funda"
  - "capa"
  - "case"
  - "protector"
  - "pelicula"
  - "cristal templado"
  - "cable"
  - "cabo"
  - "adaptador"
  - "soporte"
  - "suporte"
  - "vinilo"
  - "pegatina"
  - "sticker"
  - "skin"
  - "carcasa"
  - "almohadilla"
  - "keycap"
  - "keycaps"
  - "dock"
  - "bolsa"
  - "mochila"
  - "stand"
  - "hub usb"
  - "conector"
  - "limpiador"

# Foco exclusivo em Gama Média-Alta e Alta
